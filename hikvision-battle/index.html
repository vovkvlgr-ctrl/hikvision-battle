<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("hb2_skin")||"night"}catch(e){document.documentElement.dataset.skin="night"}</script>
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<title>Hikvision Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: camera-OSD header strip, tabbed console; game = question panel + live score rail */
:root{
  /* Viatec: white + teal (#5895A7), Inter */
  --bg:#F3F7F8; --panel:#FFFFFF; --panel2:#EAF2F4; --line:#D7E3E7; --fg:#18303A; --mute:#5E7480;
  --accent:#5895A7; --accent-ink:#2F6B7E; --accent-soft:#E3EFF2;
  --rec:#D64545; --easy:#24936A; --med:#B9800F; --hard:#D64545; --focus:#2F6B7E;
  --f-disp:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font:600 20px/1.25 var(--f-body)}
h3{font:600 15px/1.3 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* OSD header */
.osd{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.osd .rec{color:var(--fg);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.title{padding-block:26px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.title h1{font:800 clamp(30px,5vw,50px)/1 var(--f-disp);letter-spacing:-.03em}
.title h1 span{color:var(--accent)}
.title p{margin:6px 0 0;color:var(--mute);max-width:60ch}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{display:block;font:600 22px/1.1 var(--f-mono)}
.kpi small{color:var(--mute);font-size:12px}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mute);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);border-color:var(--accent)}

.grid{display:grid;gap:18px}
.grid>*{min-width:0}
section{min-width:0}
.g-game{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:860px){.g-game{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(24,48,58,.05)}
.panel>*+*{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
label.label{display:block}
.gems{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-family:var(--f-mono);font-size:13px}.gems b{font-weight:600;margin-right:6px}
.brow .gm{text-align:right}
.tiep{border-color:#8E5BD6;background:color-mix(in srgb,#8E5BD6 7%,var(--panel));margin-bottom:18px}
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:700px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hval{font-size:22px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--panel2);border-radius:8px;padding:10px 12px}.tile small{display:block;color:var(--mute);font-size:12px}.tile b{font:700 22px/1.2 var(--f-mono)}
.allt{display:grid}
.at{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.at:last-child{border-bottom:0}
.at.c{grid-template-columns:auto minmax(0,1fr) auto auto auto}
.at.me{background:var(--accent-soft);border-radius:6px}
.at .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.empick{display:flex;flex-wrap:wrap;gap:6px}
.emb-b{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px;line-height:0}
.emb-b[aria-pressed="true"]{border-color:var(--accent)}
.emb-c{width:32px;height:32px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.emb-c[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.brow .ei{line-height:0}
.tlist{display:grid;gap:8px}
.trow2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.tbar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.trow2 .mono{text-align:right}
.label{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=email],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
input[type=number]{width:90px}

/* clusters */
.cl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clb{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;text-align:left}
.clb b{display:block;font:700 14px/1.2 var(--f-disp);letter-spacing:.02em}
.clb small{color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
.clb.e b{color:var(--easy)}.clb.m b{color:var(--med)}.clb.h b{color:var(--hard)}
.clb[aria-pressed="true"].e{border-color:var(--easy);background:color-mix(in srgb,var(--easy) 12%,var(--bg))}
.clb[aria-pressed="true"].m{border-color:var(--med);background:color-mix(in srgb,var(--med) 12%,var(--bg))}
.clb[aria-pressed="true"].h{border-color:var(--hard);background:color-mix(in srgb,var(--hard) 12%,var(--bg))}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:5px 8px;border-radius:5px;border:1px solid var(--line);color:var(--mute);text-transform:uppercase}
.chip.e{color:var(--easy);border-color:color-mix(in srgb,var(--easy) 45%,transparent)}
.chip.m{color:var(--med);border-color:color-mix(in srgb,var(--med) 45%,transparent)}
.chip.h{color:var(--hard);border-color:color-mix(in srgb,var(--hard) 45%,transparent)}
.chip.ok{color:var(--easy);border-color:color-mix(in srgb,var(--easy) 45%,transparent)}
.chip.warn{color:var(--rec);border-color:color-mix(in srgb,var(--rec) 55%,transparent)}

/* question */
.q{font:500 clamp(18px,2.4vw,22px)/1.4 var(--f-body)}
.model{font:600 clamp(22px,3.6vw,30px)/1.2 var(--f-mono);letter-spacing:.03em;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:13px 14px;text-align:left;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt.right{border-color:var(--easy);background:color-mix(in srgb,var(--easy) 16%,var(--bg))}
.opt.wrong{border-color:var(--rec);background:color-mix(in srgb,var(--rec) 16%,var(--bg))}
.opt:disabled{cursor:default}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.timer{font:600 30px/1 var(--f-mono)}
.feedback{border-left:3px solid var(--line);padding:4px 0 4px 12px;color:var(--mute)}
.feedback.ok{border-color:var(--easy)}.feedback.bad{border-color:var(--rec)}
.feedback b{color:var(--fg)}
.big{font:700 44px/1 var(--f-mono)}
.lines>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.lines>div:last-child{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.me td{background:var(--accent-soft)}
.pl{display:inline-block;min-width:26px;font:600 13px var(--f-mono);color:var(--mute)}
tr:nth-child(1) .pl{color:var(--med)}
.mix{display:flex;width:90px;height:8px;border-radius:3px;overflow:hidden;background:var(--bg)}
.mix i:nth-child(1){background:var(--easy)}.mix i:nth-child(2){background:var(--med)}.mix i:nth-child(3){background:var(--hard)}
.hbar{position:relative;height:22px;background:var(--bg);border-radius:4px;min-width:140px}
.hbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.hbar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rec)}
.heat td.c{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);border:2px solid var(--panel)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.note{font-size:13px;color:var(--mute);max-width:70ch}
.note b{color:var(--fg);font-weight:600}
.warnbox{border:1px solid color-mix(in srgb,var(--rec) 50%,transparent);background:color-mix(in srgb,var(--rec) 8%,transparent);border-radius:8px;padding:10px 12px;font-size:13.5px}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.tl .num{font:700 20px/1 var(--f-disp);color:var(--mute)}
.tl .dates{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--mute)}
.tl .dates b{color:var(--fg)}
@media (max-width:560px){.tl>div{grid-template-columns:34px minmax(0,1fr)}.tl .dates{grid-column:2;text-align:left}}
.sum{font:700 34px/1 var(--f-mono)}
</style>

<style>
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{background:none;border:1px solid var(--line);border-radius:7px;padding:7px 12px;color:var(--mute)}
.sub button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.ed{display:grid;gap:10px}
.edrow{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.edrow textarea{grid-column:2/4}
@media (max-width:700px){.edrow{grid-template-columns:minmax(0,1fr)}.edrow textarea{grid-column:auto}}
.trow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;align-items:center}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;color:inherit;width:100%;min-height:60px;resize:vertical}
input[type=text],input[type=email]{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.del{color:var(--rec)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;z-index:9;max-width:calc(100% - 32px)}
.qitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.qitem .txt{min-width:0;overflow-wrap:anywhere}
.gamecard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.chip.live{color:#fff;background:var(--rec);border-color:var(--rec)}
.modebar{font-size:13px;color:var(--mute);padding:8px 12px;border:1px dashed var(--line);border-radius:8px}
.opt-ed{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.demobar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;font-size:14px}
.bhead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.btitle{font:700 clamp(22px,3.4vw,34px)/1.1 var(--f-disp)}
.bclock{font:600 clamp(24px,3.6vw,36px)/1 var(--f-mono);display:flex;gap:12px;align-items:center}
.g-board{grid-template-columns:minmax(0,1fr) 360px}
@media (max-width:900px){.g-board{grid-template-columns:minmax(0,1fr)}}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.brows{position:relative;margin-top:6px}
.brow{position:absolute;left:0;right:0;top:0;height:46px;display:grid;grid-template-columns:34px 30px minmax(0,190px) minmax(0,1fr) 20px 78px 84px;gap:12px;align-items:center;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.brow .rk{font:700 18px/1 var(--f-disp);color:var(--mute)}
.brow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bb{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.brow .bb i{display:block;height:100%;background:color-mix(in srgb,var(--accent) 55%,var(--panel));border-radius:4px;transition:width .7s ease}
.brow.first .bb i{background:var(--accent)}
.brow.first .rk{color:var(--med)}
.brow .pt{font:600 20px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.brow .mv{font-size:12px;text-align:center}.mv.up{color:var(--easy)}.mv.down{color:var(--rec)}
@media (max-width:560px){.brow{grid-template-columns:26px 28px minmax(0,1fr) 14px 58px 64px}.brow .bb{display:none}}
.fd{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);font-size:13.5px;border-radius:4px}
.fd .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd.new{animation:flash 1.4s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--fg) 14%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.brow,.brow .bb i{transition:none}.fd.new{animation:none}}
.okc{color:var(--easy)}.badc{color:var(--rec)}
.win{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.win .wname{font:800 clamp(24px,4vw,40px)/1.15 var(--f-disp);color:var(--accent-ink);margin:6px 0}
</style>
<style id="skin">
/* Skin "Полярне сяйво": cold vivid palette, glass panels over a live aurora + sensor-network canvas.
   Two moods: night (default, deep arctic navy) and ice (light frost). */
:root[data-skin="night"]{
  --page:#040A15;
  --bg:rgba(8,20,38,.78); --panel:rgba(11,25,46,.66); --panel2:rgba(28,50,84,.55); --line:rgba(125,180,240,.17);
  --fg:#E7F2FF; --mute:#8FA8C8;
  --accent:#36D6FF; --accent-ink:#8BE6FF; --accent-soft:rgba(54,214,255,.12);
  --rec:#FF4F7E; --easy:#2EF0B4; --med:#8C9BFF; --hard:#C77DFF; --focus:#8BE6FF;
  --glow:rgba(54,214,255,.45); --on-accent:#03121F;
  color-scheme:dark;
}
:root[data-skin="ice"]{
  --page:#E8F3FB;
  --bg:rgba(255,255,255,.74); --panel:rgba(255,255,255,.7); --panel2:rgba(214,234,248,.78); --line:rgba(30,90,150,.16);
  --fg:#0A2036; --mute:#4D6985;
  --accent:#0590DA; --accent-ink:#065E96; --accent-soft:rgba(5,144,218,.1);
  --rec:#E0245A; --easy:#0A9E7C; --med:#4A57E6; --hard:#9038DB; --focus:#065E96;
  --glow:rgba(5,144,218,.28); --on-accent:#fff;
  color-scheme:light;
}
:root[data-skin="hell"]{
  --page:#0A0202;
  --bg:rgba(28,6,4,.8); --panel:rgba(34,8,6,.66); --panel2:rgba(70,18,10,.55); --line:rgba(255,120,60,.2);
  --fg:#FFEFE4; --mute:#C9A08F;
  --accent:#FF6A1F; --accent-ink:#FFB070; --accent-soft:rgba(255,106,31,.13);
  --rec:#FF2D55; --easy:#FFD23F; --med:#FF8A2A; --hard:#FF3B6B; --focus:#FFB070;
  --glow:rgba(255,90,20,.5); --on-accent:#1A0400;
  color-scheme:dark;
}
html:root[data-skin="hell"] .title h1 span{background-image:linear-gradient(90deg,#FFD23F,#FF6A1F,#FF2D55,#FFB070,#FFD23F)}
:root[data-skin="hell"] .heat td.c{color:#1A0400}
:root[data-skin]{--f-disp:"Unbounded","Inter",system-ui,sans-serif}
:root[data-skin] body{background:var(--page)}
#fx,#fx2{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}#fx2{z-index:20}
:root[data-skin] .wrap{position:relative;z-index:1}
:root[data-skin] .toast{z-index:9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -12px var(--glow)}

/* glass */
:root[data-skin] .panel,:root[data-skin] .hcell{backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 50px -30px var(--glow);border-radius:16px}
:root[data-skin] .hcell{position:relative;overflow:hidden}
:root[data-skin] .hcell::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.55}
:root[data-skin] .demobar,:root[data-skin] .win,:root[data-skin] .modebar{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* type */
:root[data-skin] .title h1{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em}
:root[data-skin] .title h1 span{background:linear-gradient(90deg,var(--accent),#B9F4FF,var(--hard),var(--easy),var(--accent));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:hbShimmer 9s linear infinite}

  // optimistic local apply for snappy UI; snapshots will confirm
  if(col==='cfg')S.cfg=data||{};else if(data===null)delete S[col][id];else S[col][id]=data;
  const p=chain.then(()=>data===null?S.db.doc(path).delete():S.db.doc(path).set(data)).then(()=>true,e=>{
    console.warn('write failed',path,e);

/* ================= codes & claims ================= */
const CODE_AB='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){const a=new Uint32Array(6);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<6;i++)a[i]=Math.floor(Math.random()*1e9)}return[...a].map(x=>CODE_AB[x%CODE_AB.length]).join('')}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function hcode(gid,code){const txt=gid+':'+normCode(code);
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h1=0x811c9dc5,h2=0x01000193;for(const ch of txt){const c=ch.charCodeAt(0);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2^c,2246822519)>>>0}return'f'+h1.toString(16)+h2.toString(16)}
/* one device per team: the earliest claim after the organizer's last reset wins */
function claimOwners(gid){const g=S.games[gid],reset=(g&&g.resetClaims)||{},best={};
  if(S.mode==='db'){Object.values(S.claims).forEach(c=>{if(c.gid!==gid||!c.team||!c.at)return;if(c.at<(reset[c.team]||0))return;
    const b=best[c.team];if(!b||c.at<b.at)best[c.team]={uid:c.uid,at:c.at}});return best}
  Object.entries(S.answers).forEach(([uid,d])=>{const x=d?.games?.[gid];if(!x||!x.team||!x.claimedAt)return;if(x.claimedAt<(reset[x.team]||0))return;
    const b=best[x.team];if(!b||x.claimedAt<b.at)best[x.team]={uid,at:x.claimedAt}});return best}
/* only answers given inside the game's time slot count */
function inSlot(g,e){return g&&g.startedAt&&e.at>=g.startedAt-5000&&e.at<=(g.endsAt||Infinity)+5000}

/* ================= scoring ================= */
function evPts(e,C){const P=C.pts[e.cl]||{ok:0,bad:0},base=e.ok?P.ok:P.bad;
  const speed=(e.ok&&C.speedOn)?Math.round(P.ok*C.speedPct/100*Math.max(0,(qTimeOf(C,e.cl)-e.t)/qTimeOf(C,e.cl))):0;return{base,speed}}
function scoreEvents(evs,C){
  const s={n:evs.length,ok:0,base:0,speed:0,cnt:{e:0,m:0,h:0},okc:{e:0,m:0,h:0},time:0,bAll:0,bHard:0};
  s.gems={r:0,d:0};let sm=0,sh=0;
  evs.forEach(e=>{const p=evPts(e,C);s.base+=p.base;s.speed+=p.speed;s.cnt[e.cl]++;if(e.ok){s.ok++;s.okc[e.cl]++}s.time+=e.t;
    if(e.cl==='h'){sh=e.ok?sh+1:0;if(sh>=GEM_N){s.gems.d++;sh=0}}else if(e.cl==='m'){sm=e.ok?sm+1:0;if(sm>=GEM_N){s.gems.r++;sm=0}}
  });
  s.hardShare=s.n?s.cnt.h/s.n:0;
  if(s.cnt.e&&s.cnt.m&&s.cnt.h)s.bAll=C.bAll;
  s.hardAcc=s.cnt.h?s.okc.h/s.cnt.h:0;
  if(s.cnt.h>=C.hardMin&&s.hardAcc*100>C.hardShare)s.bHard=C.bHard;
  s.total=s.base+s.speed+s.bAll+s.bHard;return s;
}
function addS(a,b){if(!a)return clone(b);a.gems=a.gems||{r:0,d:0};a.gems.r+=b.gems?.r||0;a.gems.d+=b.gems?.d||0;['n','ok','base','speed','time','bAll','bHard','total'].forEach(k=>a[k]+=b[k]);['e','m','h'].forEach(k=>{a.cnt[k]+=b.cnt[k];a.okc[k]+=b.okc[k]});return a}
function finS(s){s.acc=s.n?s.ok/s.n:0;s.avgT=s.n?s.time/s.n:0;s.hardShare=s.n?s.cnt.h/s.n:0;return s}
/* scope: array of game ids */
function compute(gids){
  if(gids.length>1)gids=gids.filter(id=>!S.games[id]?.superfinal);
  const single=gids.length===1?S.games[gids[0]]:null,mythic=!!(single&&single.superfinal),only=single&&single.participants;
  const C=sc(),tm=teamsMap(),players={},teams={},evAll=[];
  teamsList().filter(t=>!only||only.includes(t.id)).forEach(t=>teams[t.id]={id:t.id,name:t.name,official:t.official,em:t.em,reg:t.reg||t.official,s:null,members:new Set()});
  const claims={};gids.forEach(gid=>claims[gid]=claimOwners(gid));
  Object.entries(S.answers).forEach(([uid,doc])=>{
    gids.forEach(gid=>{const g=doc?.games?.[gid],game=S.games[gid];if(!g||!g.ev||!g.ev.length)return;
      if(claims[gid][g.team]?.uid!==uid)return;if(only&&!only.includes(g.team))return;
      const ev=g.ev.filter(e=>inSlot(game,e));if(!ev.length)return;
      const s=scoreEvents(ev,C);ev.forEach(e=>evAll.push(Object.assign({uid,team:g.team,gid},e)));
      const p=players[uid]||(players[uid]={id:uid,name:g.name||'Команда',team:g.team,s:null});p.s=addS(p.s,s);p.name=g.name||p.name;p.team=g.team;
      const t=teams[g.team]||(teams[g.team]={id:g.team,name:(tm[g.team]||{}).name||'Без команди',reg:'—',s:null,members:new Set()});t.s=addS(t.s,s);t.members.add(uid);
    })});
  /* one diamond per game for the fastest correct HARD answer, one ruby for the fastest correct MEDIUM */
  const fast={};
  gids.forEach(gid=>{if(S.games[gid]?.superfinal)return;const f={d:null,r:null};
    evAll.forEach(e=>{if(e.gid!==gid||!e.ok)return;const k=e.cl==='h'?'d':e.cl==='m'?'r':null;if(!k)return;const b=f[k];if(!b||e.t<b.t||(e.t===b.t&&e.at<b.at))f[k]=e});
    fast[gid]=f;['d','r'].forEach(k=>{const e=f[k];if(e&&teams[e.team]?.s){teams[e.team].s.gems=teams[e.team].s.gems||{r:0,d:0};teams[e.team].s.gems[k]++;const p=players[e.uid];if(p&&p.s){p.s.gems=p.s.gems||{r:0,d:0};p.s.gems[k]++}}})});
  const ps=Object.values(players).map(p=>(finS(p.s),p)).sort((a,b)=>b.s.total-a.s.total);
  const ts=Object.values(teams).map(t=>{t.s=finS(t.s||scoreEvents([],C));t.raw=t.s.total;t.total=C.capOn&&gids.length===1?Math.min(t.raw,C.teamTarget):t.raw;t.size=t.members.size;return t})
    ;
  if(mythic)ts.forEach(t=>{t.total=t.raw=t.s.okc.h;t.myth=t.s.okc.h});
  /* tie-break: points, then diamonds, then rubies, then the latest superfinal both teams played */
  const sfs=(!single)?seasonGames().filter(g=>g.superfinal&&g.startedAt&&!isLive(g)).reverse().map(g=>{const r=compute([g.id]);const pos={};r.ts.forEach((t,i)=>{const prev=r.ts[i-1];pos[t.id]=(prev&&r.cmp(prev,t)===0)?pos[prev.id]:i});return pos}):[];
  const cmp=(a,b)=>{const d=b.total-a.total;if(d)return d;if(mythic)return 0;const gd=(b.s.gems?.d||0)-(a.s.gems?.d||0);if(gd)return gd;const gr=(b.s.gems?.r||0)-(a.s.gems?.r||0);if(gr)return gr;
    for(const pos of sfs){if(a.id in pos&&b.id in pos&&pos[a.id]!==pos[b.id])return pos[a.id]-pos[b.id]}return 0};
  ts.sort(cmp);
  const regs={};ts.forEach(t=>{const r=regs[t.reg]||(regs[t.reg]={name:t.reg,teams:[],total:0,n:0,ok:0});r.teams.push(t.name);r.total+=t.total;r.n+=t.s.n;r.ok+=t.s.ok});
  const regions=Object.values(regs).map(r=>Object.assign(r,{per:r.teams.length?r.total/r.teams.length:0,acc:r.n?r.ok/r.n:0})).sort((a,b)=>b.per-a.per);
  return{ps,ts,regions,ev:evAll,C,cmp,mythic,fast};
}

let entering=false;
async function enterCode(arg){
  if(entering)return;const code=normCode(typeof arg==='string'?arg:$('#codeIn')?.value);if(code.length<4){toast('Введіть код із листа.');return}
  if(S.readonly){toast('Немає з’єднання з грою. Оновіть сторінку.');return}
  entering=true;
  try{
    const cand=seasonGames().filter(x=>x.hashes&&(isLive(x)||x.status==='planned'));
    for(const g of cand){const h=await hcode(g.id,code);let team=null;
      if(S.mode==='db'){/* the code is checked by the database itself: only a valid code opens its key */
        try{const k=await S.db.doc('keys/'+h).get();if(k.exists&&k.data().gid===g.id)team=k.data().team}catch(e){console.warn(e)}
        if(team){try{await S.db.doc('claims/'+g.id+'__'+S.uid).set({gid:g.id,team,uid:S.uid,key:h,at:Date.now()+CLOCK_OFF})}catch(e){console.warn(e);toast('Не вдалося підтвердити вхід. Спробуйте ще раз.');return}}}
      else team=Object.keys(g.hashes).find(t=>g.hashes[t]===h);
      if(team){const tn=teamsMap()[team]?.name||'Команда';myAns.games=myAns.games||{};
        const prev=myAns.games[g.id];if(!prev||prev.team!==team)myAns.games[g.id]={name:tn,team,claimedAt:vnow(),ev:[]};
        G.gid=g.id;G.codeDraft='';G.state='idle';me.team=team;myDirty=true;
        await write('answers/'+S.uid,clone(myAns));myDirty=false;toast('Вхід підтверджено: '+tn);if(isLive(g)){showTab('game');startRound()}else renderAll();return}}
    toast(cand.length?'Код не підходить. Перевірте лист і спробуйте ще раз.':'Зараз немає гри, до якої можна увійти.');
  }finally{entering=false}
}
function qPool(g){const b=blockOf(g);if(!b)return[];const keys=b.final?(season().blocks.map(x=>x.key)):[b.key];
  return Object.entries(S.questions).map(([id,q])=>Object.assign({id},q)).filter(q=>keys.includes(q.block))}
function pickQ(){const g=S.games[G.gid];const all=qPool(g).filter(q=>q.cl===G.cl);if(!all.length)return null;
  const done=new Set((myAns.games?.[G.gid]?.ev||[]).map(e=>e.q));
  let pool=all.filter(q=>!G.used.has(q.id)&&!done.has(q.id));if(!pool.length)pool=all.filter(q=>!done.has(q.id));if(!pool.length){all.forEach(q=>G.used.delete(q.id));pool=all}
  const q=pool[Math.floor(Math.random()*pool.length)];G.used.add(q.id);const order=q.o.map((_,i)=>i);if(q.o.length>2)order.sort(()=>Math.random()-.5);return Object.assign({},q,{order})}
function startRound(){const g=S.games[G.gid];if(g&&g.superfinal)G.cl='h';if((myAns.games?.[G.gid]?.ev||[]).length>=gameLimit(g)){G.state='done';G.roundEv=[];renderGame();return}if(!isLive(g)){toast('Гра вже завершилася.');G.state='idle';renderGame();return}
  G.state='play';G.roundEv=[];G.roundEnd=Date.now()+Math.min(sc().round>0?sc().round*1000:Infinity,g.endsAt-vnow());nextQ();renderGame()}
function nextQ(){if(clLeft(G.gid,G.cl)<=0){const old=G.cl,nx=['e','m','h'].find(k=>clLeft(G.gid,k)>0);if(nx){G.cl=nx;setTimeout(()=>toast(`${CL[old].name}: усі питання пройдено, далі ${CL[nx].name}`),0)}}G.q=pickQ();G.qStart=Date.now();G.answered=false;G.fb=null}
function setCl(cl){if(clLeft(G.gid,cl)<=0)return;G.cl=cl;if(G.state==='play'&&!G.answered)nextQ();renderGame()}
function answer(i){if(G.answered||G.state!=='play'||!G.q)return;if(!isLive(S.games[G.gid])){endRound();return}G.answered=true;
  const q=G.q,ok=i===q.a,t=+((Date.now()-G.qStart)/1000).toFixed(1);
  const ev={cl:q.cl,ok,t,q:q.id,topic:q.topic||'Інше',at:vnow()};
  myAns.games=myAns.games||{};const mg=myAns.games[G.gid];if(!mg){endRound();return}
  mg.ev=mg.ev||[];const g0=scoreEvents(mg.ev,sc()).gems;mg.ev.push(ev);const g1=scoreEvents(mg.ev,sc()).gems;
  if(!S.games[G.gid]?.superfinal){if(g1.d>g0.d)setTimeout(()=>toast('Діамант! 5 правильних HARD поспіль'),50);else if(g1.r>g0.r)setTimeout(()=>toast('Рубін! 5 правильних MEDIUM поспіль'),50)}
  G.roundEv.push(ev);
  G.fb={ok,i,p:evPts(ev,sc()),t};saveMine();renderGame();
  const lim=gameLimit(S.games[G.gid]),perR=S.games[G.gid]?.superfinal?lim:sc().qPerRound;
  setTimeout(()=>{if(G.state==='play'){if(Date.now()>=G.roundEnd||mg.ev.length>=lim||G.roundEv.length>=perR)endRound();else{nextQ();renderGame()}}},ok?1100:2200);
}

  saveTimer=setTimeout(async()=>{const data=clone(myAns);await write('answers/'+S.uid,data);myDirty=false},600)}
function endRound(){G.state='done';renderGame()}
function gameTick(){if(!isLive(S.games[G.gid])&&!G.answered){endRound();return}const left=G.roundEnd-Date.now();if(left<=0&&!G.answered){endRound();return}
  const QT=G.q?qTimeOf(sc(),G.q.cl):0,e2=(Date.now()-G.qStart)/1000;
  const el=$('#rTimer');if(el&&!G.answered)el.textContent=mmss(Math.max(0,QT-e2));
  if(G.q&&!G.answered&&e2>=QT){nextQ();renderGame();toast('Час вийшов — наступне питання');return}
  const qb=$('#qBar');if(qb&&!G.answered){qb.style.width=Math.max(0,100-e2/QT*100)+'%';const qt=$('#qT');if(qt)qt.textContent=`${Math.ceil(Math.max(0,QT-e2))} с з ${QT}`}}

function teamGameStats(gid,team){
  const R=compute([gid]),C=R.C,t=R.ts.find(x=>x.id===team),ev=R.ev.filter(e=>e.team===team);
  let earned=0,lost=0;ev.forEach(e=>{const p=evPts(e,C);if(p.base>0)earned+=p.base;else lost-=p.base;earned+=p.speed});
  const s=t?t.s:finS(scoreEvents([],C));earned+=s.bAll+s.bHard;
  return{R,t,s,earned,lost,total:t?t.total:0,rank:t&&t.s.n?R.ts.indexOf(t)+1:'—',of:R.ts.length}}

    return`<div><span class="num">${i+1}</span><div><h3>${esc(b.name)}${b.final?' <span class="chip">фінал</span>':''}</h3><div class="note" style="margin-top:4px">${esc(b.desc)}</div></div><div class="dates">навчання ${esc(b.training)||'—'}<br>гра <b>${esc(b.game)||'дата не призначена'}</b>${g?`<br>${statusChip(g)}`:''}</div></div>`}).join('')}</div></div>`}
function statusChip(g){if(isLive(g))return'<span class="chip live">наживо</span>';if(g.status==='planned')return'<span class="chip">заплановано</span>';return'<span class="chip ok">зіграно</span>'}
function bindCommon(root){root.querySelectorAll('[data-tabgo]').forEach(b=>b.onclick=()=>showTab(b.dataset.tabgo));root.querySelectorAll('[data-go-admin]').forEach(b=>b.onclick=()=>{adminSub='games';showTab('admin')})}

/* ================= RATING ================= */
let rtScope='season',rtView='teams';const RT_VIEWS=[['teams','Команди'],['regions','Регіони']];
function scopeIds(){const gs=seasonGames();if(rtScope==='season')return gs.map(g=>g.id);return gs.some(g=>g.id===rtScope)?[rtScope]:(rtScope='season',gs.map(g=>g.id))}
function scopeSelect(id){const gs=seasonGames();return`<select id="${id}" aria-label="Що показати"><option value="season">Увесь сезон</option>${gs.map(g=>`<option value="${g.id}" ${rtScope===g.id?'selected':''}>${esc(g.title)}${isLive(g)?' · наживо':''}</option>`).join('')}</select>`}
function renderRating(){
  const el=$('#tab-rating');if(!season()){el.innerHTML='';return}
  const R=compute(scopeIds()),C=R.C,single=rtScope!=='season';
  const max=Math.max(single?C.teamTarget:1,...R.ts.map(t=>t.total))*1.05||1;
  let body;
  if(rtView==='players')rtView='teams';
  if(!R.ps.length)body=`<div class="empty">Ще немає жодної відповіді. Рейтинг з’явиться, щойно команди почнуть відповідати.</div>`;
  else if(rtView==='teams')body=`<div class="tw"><table><thead><tr><th>#</th><th>Команда</th><th>Регіон</th><th class="n">Відповідей</th><th class="n">Точність</th><th class="n">Камені</th><th>${single?'До цілі '+fmt(C.teamTarget):'Бали'}</th><th class="n">Разом</th></tr></thead><tbody>
    ${R.ts.map((t,i)=>`<tr class="${t.id===me.team?'me':''}"><td><span class="pl">${i+1}</span></td><td><span class="row" style="gap:8px;flex-wrap:nowrap">${emblem(t.em,24)}${esc(t.name)}</span></td><td class="mute">${esc(t.reg)}</td><td class="n">${t.s.n}</td><td class="n">${pct(t.s.acc)}</td><td class="n">${gemsHtml(t.s.gems)}</td>
    <td><div class="hbar"><i style="width:${Math.max(0,t.total)/max*100}%"></i>${single?`<span class="tgt" style="left:${C.teamTarget/max*100}%"></span>`:''}</div></td><td class="n"><b>${fmt(t.total)}</b>${C.capOn&&single&&t.raw>t.total?`<br><small class="mute">з ${fmt(t.raw)}</small>`:''}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">При рівних балах вище команда з більшою кількістю діамантів, потім рубінів. Якщо й вони рівні за призове місце — суперфінал.${single?` Червона риска — орієнтир ${fmt(C.teamTarget)} балів за гру.`:''}</p>`;
  else if(rtView==='players_off')body=`<div class="tw"><table><thead><tr><th>#</th><th>Гравець</th><th>Команда</th><th>Кластери</th><th class="n">Відп.</th><th class="n">Точність</th><th class="n">Сер. час</th><th class="n">База</th><th class="n">Швидк.</th><th class="n">Бонуси</th><th class="n">Разом</th></tr></thead><tbody>
    ${R.ps.map((p,i)=>`<tr class="${p.id===S.uid?'me':''}"><td><span class="pl">${i+1}</span></td><td>${esc(p.name)}</td><td class="mute">${esc(teamsMap()[p.team]?.name||'—')}</td><td>${mixBar(p.s.cnt)}</td><td class="n">${p.s.n}</td><td class="n">${pct(p.s.acc)}</td><td class="n">${p.s.avgT.toFixed(1)} с</td><td class="n">${fmt(p.s.base)}</td><td class="n">${fmt(p.s.speed)}</td><td class="n">${p.s.bAll+p.s.bHard?'+'+(p.s.bAll+p.s.bHard):'—'}</td><td class="n"><b>${fmt(p.s.total)}</b></td></tr>`).join('')}</tbody></table></div>
    <div class="legend"><span><i class="sw" style="background:var(--easy)"></i>EASY</span><span><i class="sw" style="background:var(--med)"></i>MEDIUM</span><span><i class="sw" style="background:var(--hard)"></i>HARD</span></div>`;
  else body=`<div class="tw"><table><thead><tr><th>#</th><th>Регіон</th><th>Команди</th><th class="n">Команд</th><th class="n">Точність</th><th class="n">Сума балів</th><th class="n">На команду</th></tr></thead><tbody>
    ${R.regions.map((r,i)=>`<tr><td><span class="pl">${i+1}</span></td><td>${esc(r.name)}</td><td class="mute" style="white-space:normal;min-width:180px">${r.teams.map(esc).join(', ')}</td><td class="n">${r.teams.length}</td><td class="n">${pct(r.acc)}</td><td class="n">${fmt(r.total)}</td><td class="n"><b>${fmt(r.per)}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="note">Регіони різного розміру, тому рейтинг регіонів іде за середніми балами на команду. Регіон задається для кожної команди в керуванні.</p>`;
  el.innerHTML=`<div class="panel"><div class="row sp"><div class="row">${scopeSelect('rtScope')}</div>
    <div class="row" role="group">${RT_VIEWS.map(([k,l])=>`<button class="btn" data-rt="${k}" aria-pressed="${rtView===k}" style="${rtView===k?'border-color:var(--fg)':''}">${l}</button>`).join('')}</div></div>${body}</div>`;
  $('#rtScope').onchange=e=>{rtScope=e.target.value;renderRating();renderAnalytics()};
  $$('[data-rt]').forEach(b=>b.onclick=()=>{rtView=b.dataset.rt;renderRating()});
}

/* ================= ANALYTICS ================= */
function renderAnalytics(){
  const el=$('#tab-analytics');if(!season()){el.innerHTML='';return}
  const R=compute(scopeIds()),ev=R.ev;
  const head=`<div class="row" style="margin-bottom:16px">${scopeSelect('anScope')}</div>`;
  if(!ev.length){el.innerHTML=head+`<div class="empty">Аналітика з’явиться після перших відповідей.</div>`;$('#anScope').onchange=e=>{rtScope=e.target.value;renderRating();renderAnalytics()};return}
  const acc=f=>{const e=ev.filter(f);return{n:e.length,a:e.length?e.filter(x=>x.ok).length/e.length:0}};
  const topics=[...new Set(ev.map(e=>e.topic))];
  const teams=R.ts.filter(t=>t.s.n);
  const heat=`<div class="tw"><table class="heat"><thead><tr><th>Команда</th>${topics.map(t=>`<th style="text-align:center">${esc(t)}</th>`).join('')}<th class="n">Слабке місце</th></tr></thead><tbody>
    ${teams.map(t=>{const cells=topics.map(tp=>Object.assign({tp},acc(e=>e.team===t.id&&e.topic===tp)));const weak=cells.filter(c=>c.n).sort((a,b)=>a.a-b.a)[0];
    return`<tr><td>${esc(t.name)}</td>${cells.map(c=>c.n?`<td class="c" style="background:${heatColor(c.a)}" title="${c.n} відповідей">${pct(c.a)}</td>`:`<td class="c mute">—</td>`).join('')}<td class="n">${weak&&weak.a<.65?`<span class="chip warn">${esc(weak.tp)}</span>`:weak?`<span class="mute">${esc(weak.tp)}</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  const byCl=['e','m','h'].map(k=>Object.assign({k},acc(e=>e.cl===k))),tot=ev.length;
  const byTopic=topics.map(t=>Object.assign({t},acc(e=>e.topic===t))).sort((a,b)=>a.a-b.a);
  const qs=Object.entries(S.questions).map(([id,q])=>Object.assign({id},q));
  const byQ=qs.map(q=>Object.assign({q},acc(e=>e.q===q.id))).filter(x=>x.n>=3).sort((a,b)=>a.a-b.a).slice(0,6);
  el.innerHTML=head+`<div class="grid"><div class="grid g3">${byCl.map(c=>`<div class="panel"><div class="row sp"><span class="chip ${c.k}">${CL[c.k].name}</span><span class="mono mute">${pct(c.n/tot)} відповідей</span></div><div class="big">${pct(c.a)}</div><div class="mute">правильних із ${fmt(c.n)}</div></div>`).join('')}</div>
   <div class="panel"><div class="row sp"><h2>Точність: команда × тема</h2><span class="label">хто де просідає</span></div>${heat}
   <div class="legend"><span><i class="sw" style="background:${heatColor(.45)}"></i>до 50%</span><span><i class="sw" style="background:${heatColor(.68)}"></i>~70%</span><span><i class="sw" style="background:${heatColor(.92)}"></i>90%+</span><span>Червона мітка — тема нижче 65%, кандидат на додаткове навчання.</span></div></div>
   <div class="grid g2"><div class="panel"><h3>Теми від найслабшої</h3><div class="lines">${byTopic.map(t=>`<div><span>${esc(t.t)}</span><span class="mono">${pct(t.a)} <span class="mute">· ${t.n}</span></span></div>`).join('')}</div></div>
   <div class="panel"><h3>Найважчі питання</h3>${byQ.length?`<div class="lines">${byQ.map(x=>{const t=x.q.model||x.q.q;return`<div><span style="min-width:0"><span class="chip ${x.q.cl}" style="margin-right:6px">${CL[x.q.cl].name}</span>${esc(t.slice(0,60))}${t.length>60?'…':''}</span><span class="mono">${pct(x.a)}</span></div>`}).join('')}</div>`:'<p class="note">Потрібно щонайменше 3 відповіді на питання.</p>'}</div></div></div>`;
  $('#anScope').onchange=e=>{rtScope=e.target.value;renderRating();renderAnalytics()};
}

/* ================= RULES ================= */

  const C=sc(),P=C.pts,el=$('#tab-rules');
  el.innerHTML=`<div class="grid g2"><div class="panel"><h2>Бали за питання</h2>
    <div class="tw"><table><thead><tr><th>Кластер</th><th class="n">Правильно</th><th class="n">Помилка</th></tr></thead><tbody>
    ${['e','m','h'].map(k=>`<tr><td><span class="chip ${k}">${CL[k].name}</span> <span class="mute">${CL[k].ua}</span></td><td class="n">+${P[k].ok}</td><td class="n">${P[k].bad}</td></tr>`).join('')}</tbody></table></div>

    <div><span>${gemIcon('r',18)} Рубін — за 5 правильних MEDIUM поспіль, і ще один на гру — за найшвидшу правильну відповідь на MEDIUM</span><span class="mono">нічия</span></div>
    <div><span>${gemIcon('m',18)} Міфічний камінь — правильна відповідь у суперфіналі</span><span class="mono">суперфінал</span></div></div>
    <p class="note">Камені не додають балів. Вони вирішують нічию: спершу діаманти, потім рубіни. Серія рахується всередині свого кластера: помилка в ньому обриває, EASY не впливає. Швидкість — час від показу питання до відповіді; камінь за швидкість закріплюється після завершення гри.</p>

   <div class="panel"><h2>Як іде гра</h2><div class="lines">
    <div><span class="mute">Коли</span><span>лише в часовий слот, який відкриває організатор</span></div>
    <div><span class="mute">Гра</span><span>${C.qPerGame} питань: ${C.quota.e} EASY, ${C.quota.m} MEDIUM, ${C.quota.h} HARD; раунди по ${C.qPerRound}; без повторів</span></div>
    <div><span class="mute">Максимум</span><span><b>${fmt(maxGame(C))}</b> балів за гру (${fmt(maxGame(C)-C.bAll-C.bHard)} за питання + ${fmt(C.bAll+C.bHard)} бонусів)</span></div>
    <div><span class="mute">Раунд</span><span>${C.qPerRound} питань${C.round>0?`, до ${mmss(C.round)}`:''}</span></div>
    <div><span class="mute">Час на питання</span><span>EASY ${fmtT(C.qTimeE)}, MEDIUM ${fmtT(C.qTimeM)}, HARD ${fmtT(C.qTimeH)}; не встигли — пропуск без штрафу</span></div>
    <div><span class="mute">Кластер</span><span>обираєте самі, перемикати можна будь-коли</span></div>

    ${season()?`<div style="margin-top:18px">${renderSeasonOverview()}</div>`:''}`;
}

/* ================= ADMIN ================= */
let adminSub='season',draft=null,draftSid=null,qFilter='',qEdit=null;
function renderAdmin(){
  const el=$('#tab-admin');if(!S.isOwner){el.innerHTML='';return}
  if(adminSub==='season'&&draft&&$('#sName')&&!skipSync){syncDraft();draft.name=$('#sName').value;draft.link=$('#sLink').value}skipSync=false;
  const subs=[['season','Сезон'],['games','Ігри'],['questions','Питання'],['scoring','Бали'],['prize','Призи']];
  let body='';
  try{body=({season:adminSeason,games:adminGames,questions:adminQuestions,scoring:adminScoring,prize:adminPrize})[adminSub]()}catch(e){body='<div class="empty">Помилка відображення.</div>';console.error(e)}
  el.innerHTML=`<div class="sub" style="margin-bottom:16px">${subs.map(([k,l])=>`<button data-sub="${k}" aria-pressed="${adminSub===k}">${l}</button>`).join('')}</div>${body}`;
  $$('[data-sub]').forEach(b=>b.onclick=()=>{adminSub=b.dataset.sub;renderAdmin()});
  ({season:bindSeason,games:bindGames,questions:bindQuestions,scoring:bindScoring,prize:bindPrize})[adminSub]();
}
/* --- season --- */
function adminSeason(){
  const sid=S.cfg.activeSeason,s=season();
  if(draftSid!==sid||!draft){draft=s?clone(s):null;draftSid=sid}
  const list=Object.entries(S.seasons).sort((a,b)=>(b[1].created||0)-(a[1].created||0));
  const top=`<div class="panel"><div class="row sp"><h2>Активний сезон</h2>
    <div class="row">${list.length?`<select id="actSeason" aria-label="Активний сезон">${list.map(([id,x])=>`<option value="${id}" ${id===sid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div></div>
    <div class="row"><input type="text" id="newSeasonName" placeholder="Назва нового сезону, напр. Hikvision Battle ${new Date().getFullYear()+1}" style="flex:1 1 260px">
    <label class="row" style="gap:6px"><input type="checkbox" id="copyPrev" checked> скопіювати блоки й команди</label>
    <button class="btn" id="newSeason">Створити сезон</button></div>
    <p class="note">Гра щорічна: на новий рік створіть новий сезон. Блоки, команди й банк питань переносяться, дати очищаються. Результати минулих сезонів лишаються в архіві.</p></div>`;
  if(!draft)return top;
  return top+`<div class="panel" style="margin-top:18px"><div class="row sp"><h2>Налаштування сезону</h2><button class="btn pri" id="saveSeason">Зберегти сезон</button></div>
    <label class="label" for="sName">Назва</label><input type="text" id="sName" value="${esc(draft.name)}">
    <label class="label" for="sLink">Посилання на гру для листа капітанам</label><input type="text" id="sLink" value="${esc(draft.link||'')}" placeholder="${esc(location.origin+location.pathname)}">
    <h3>Блоки</h3><p class="note">Дати — вільний текст, можна лишити порожніми й заповнити пізніше. Ключ банку питань зв’язує блок з питаннями й переходить із сезону в сезон.</p>
    <div class="ed">${draft.blocks.map((b,i)=>`<div class="edrow">
      <input type="text" data-b="${i}" data-f="key" value="${esc(b.key)}" aria-label="Ключ банку питань" title="Ключ банку питань">
      <input type="text" data-b="${i}" data-f="name" value="${esc(b.name)}" aria-label="Назва блоку">
      <div class="row" style="flex-wrap:nowrap"><input type="text" data-b="${i}" data-f="training" value="${esc(b.training)}" placeholder="дати навчань" aria-label="Дати навчань"><input type="text" data-b="${i}" data-f="game" value="${esc(b.game)}" placeholder="дата гри" aria-label="Дата гри"></div>
      <div class="row" style="flex-wrap:nowrap"><label class="row" style="gap:4px;font-size:13px"><input type="checkbox" data-b="${i}" data-f="final" ${b.final?'checked':''}>фінал</label><button class="btn sm del" data-delb="${i}" aria-label="Видалити блок">✕</button></div>
      <textarea data-b="${i}" data-f="desc" aria-label="Опис блоку">${esc(b.desc)}</textarea></div>`).join('')}</div>
    <button class="btn sm" id="addBlock">+ Додати блок</button>
    <h3>Команди</h3><p class="note">Одна команда — один капітан і один пристрій. На пошту капітана надсилається код перед кожною грою. Регіон потрібен для рейтингу регіонів: кілька команд одного міста отримують однаковий регіон.</p>
    <div class="ed">${draft.teams.map((t,i)=>`<div class="trow"><input type="text" data-t="${i}" data-f="name" value="${esc(t.name)}" aria-label="Назва команди"><input type="text" data-t="${i}" data-f="reg" value="${esc(t.reg)}" placeholder="регіон" aria-label="Регіон"><input type="email" data-t="${i}" data-f="email" value="${esc(t.email||'')}" placeholder="пошта капітана" aria-label="Пошта капітана"><button class="btn sm del" data-delt="${i}" aria-label="Видалити команду">✕</button></div>${(()=>{const tb=teamsMap()[t.id];return tb&&(tb.name!==tb.official||brandMap()[t.id])?`<div class="row note" style="gap:8px;margin:-2px 0 6px">${emblem(tb.em,20)} Команда обрала: «${esc(tb.name)}» <button class="btn sm" data-rbrand="${i}">Скинути назву й емблему</button></div>`:''})()}`).join('')}</div>
    <button class="btn sm" id="addTeam">+ Додати команду</button></div>`;
}
function syncDraft(){$$('#tab-admin [data-b]').forEach(x=>{const b=draft.blocks[+x.dataset.b];if(!b)return;b[x.dataset.f]=x.type==='checkbox'?x.checked:x.value});
  $$('#tab-admin [data-t]').forEach(x=>{const t=draft.teams[+x.dataset.t];if(t)t[x.dataset.f]=x.value})}
let skipSync=false;
function bindSeason(){
  const a=$('#actSeason');if(a)a.onchange=()=>{write('cfg/main',Object.assign({},S.cfg,{activeSeason:a.value}));draft=null};
  $('#newSeason').onclick=()=>{const name=$('#newSeasonName').value.trim();if(!name){toast('Вкажіть назву сезону.');return}
    const base=$('#copyPrev').checked&&season()?clone(season()):clone(STARTER_SEASON);
    base.blocks.forEach(b=>{b.training='';b.game=''});base.name=name;base.created=Date.now();
    const id=nid('s');write('seasons/'+id,base).then(ok=>{if(ok!==false){write('cfg/main',Object.assign({},S.cfg,{activeSeason:id}));draft=null;toast('Сезон створено.')}})};
  if(!draft)return;
  $('#addBlock').onclick=()=>{syncDraft();draft.blocks.push({id:nid('b'),key:'block'+(draft.blocks.length+1),name:'Новий блок',desc:'',training:'',game:''});renderAdmin()};

function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const sc0=document.createElement('script');sc0.src='vendor/xlsx.full.min.js';sc0.onload=()=>res(window.XLSX);sc0.onerror=()=>rej(new Error('load'));document.head.appendChild(sc0)})}
const normTxt=v=>String(v??'').replace(/\s+/g,' ').trim();
function mapCluster(v){const t=normTxt(v).toLowerCase();if(/^(easy|e|легк|прост|базов)/.test(t))return'e';if(/^(medium|m|серед|мід)/.test(t))return'm';if(/^(hard|h|склад|хард)/.test(t))return'h';return null}
function mapLetter(v){const t=normTxt(v).toUpperCase();const m={A:0,B:1,C:2,D:3,'А':0,'В':1,'С':2,'Б':1,'Г':3,'Д':3,'1':0,'2':1,'3':2,'4':3};return t in m?m[t]:null}
async function parseQuestionFile(file){
  const XLSX=await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sn=wb.SheetNames.find(n=>/питан/i.test(n))||wb.SheetNames[0];const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>/^питання/i.test(normTxt(c)))&&r.some(c=>/кластер/i.test(normTxt(c))));
  if(hi<0)return{items:[],errors:['Не знайдено рядок заголовків із колонками «Питання» і «Кластер». Використайте шаблон.'],sheet:sn};
  const H=rows[hi].map(c=>normTxt(c).toLowerCase()),col=re=>H.findIndex(h=>re.test(h));
  const ci={block:col(/^блок/),cl:col(/кластер/),type:col(/^тип/),topic:col(/^тема/),model:col(/модель/),q:col(/^питання/),ok:col(/правильн/),n:col(/поясн/)};
  const opt=H.map((h,i)=>/^варіант/.test(h)?i:-1).filter(i=>i>=0).slice(0,4);
  const blocks=season()?.blocks||[],items=[],errors=[];
  rows.slice(hi+1).forEach((r,k)=>{const rowNo=hi+2+k,get=i=>i>=0?normTxt(r[i]):'';
    if(!r.some(c=>normTxt(c)))return;
    const err=m=>errors.push(`Рядок ${rowNo}: ${m}`);
    const bt=get(ci.block).toLowerCase(),b=blocks.find(x=>x.name.toLowerCase()===bt||x.key===bt);if(!b){err(bt?`блок «${get(ci.block)}» не знайдено в сезоні`:'не вказано блок');return}
    const cl=mapCluster(get(ci.cl));if(!cl){err('кластер має бути EASY, MEDIUM або HARD');return}
    const q=get(ci.q);if(!q){err('немає тексту питання');return}
    const raw=opt.map(i=>get(i));const L=mapLetter(get(ci.ok));
    if(L===null){err('у колонці «Правильна» оберіть A, B, C або D');return}
    if(!raw[L]){err(`позначено варіант ${'ABCD'[L]}, але він порожній`);return}
    const filled=raw.map((o,i)=>({o,i})).filter(x=>x.o);if(filled.length<2){err('потрібно щонайменше два варіанти');return}
    let type=QTYPES.find(t=>t.toLowerCase()===get(ci.type).toLowerCase());
    if(!type)type=filled.length===2&&/^так$/i.test(filled[0].o)&&/^ні$/i.test(filled[1].o)?'Так / ні':(get(ci.model)?'Розшифровка':'Вибір');
    items.push({row:rowNo,block:b.key,blockName:b.name,cl,type,topic:get(ci.topic)||'Інше',model:get(ci.model),q,o:filled.map(x=>x.o),a:filled.findIndex(x=>x.i===L),n:get(ci.n)});
  });
  return{items,errors,sheet:sn,file:file.name};
}

<script>
/* ===== live background: aurora ribbons + drifting sensor network + answer bursts ===== */
(function(){
  const root=document.documentElement;
  let skin='night';try{skin=localStorage.getItem('hb2_skin')||'night'}catch(e){}
  root.dataset.skin=skin;
  /* theme switch in the OSD strip */
  const osd=document.querySelector('.osd');
  if(osd){const b=document.createElement('button');b.className='skinbtn';b.type='button';
    const NAMES={night:'полярна ніч',ice:'крига',hell:'пекло'},ORDER=['night','ice','hell'];
    if(!NAMES[root.dataset.skin])root.dataset.skin='night';
    const lab=()=>{b.textContent='Тема: '+NAMES[root.dataset.skin];b.title='Змінити тему'};lab();
    b.onclick=()=>{root.dataset.skin=ORDER[(ORDER.indexOf(root.dataset.skin)+1)%ORDER.length];try{localStorage.setItem('hb2_skin',root.dataset.skin)}catch(e){}lab();paintStatic=true};
    osd.appendChild(b)}

  const c=document.getElementById('fx'),x=c.getContext('2d'),c2=document.getElementById('fx2'),y=c2.getContext('2d');let had=false;
  const rm=matchMedia('(prefers-reduced-motion: reduce)');
  let W=0,H=0,dpr=1,nodes=[],parts=[],embers=[],paintStatic=true;
  function size(){dpr=Math.min(1.5,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=c2.width=W*dpr;c.height=c2.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);y.setTransform(dpr,0,0,dpr,0,0);
    const ne=Math.round(Math.min(110,W*H/14000));embers=Array.from({length:ne},()=>newEmber(true));const n=Math.round(Math.min(70,W*H/26000));nodes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,p:Math.random()*6.28,blink:0}));paintStatic=true}
  addEventListener('resize',size);size();

  const PAL={night:{bands:[[54,214,255],[140,110,255],[46,240,180]],node:'140,210,255',a:.30,line:.16,mode:'lighter'},
             ice:{bands:[[5,144,218],[120,90,240],[10,170,140]],node:'20,110,180',a:.13,line:.12,mode:'source-over'}};
  function aurora(t,P){
    x.globalCompositeOperation=P.mode;
    P.bands.forEach((col,k)=>{
      const base=H*(.18+k*.16),amp=40+k*18,th=170+k*40;
      const g=x.createLinearGradient(0,base-th,0,base+th);
      g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.5,`rgba(${col},${P.a})`);g.addColorStop(1,`rgba(${col},0)`);
      x.fillStyle=g;x.beginPath();
      for(let i=0;i<=W+40;i+=40){const y=base+Math.sin(i*.0035+t*.00022*(k+1))*amp+Math.sin(i*.0011-t*.00013*(k+2))*amp*.8;
        i?x.lineTo(i,y-th):x.moveTo(i,y-th)}
      for(let i=W+40;i>=0;i-=40){const y=base+Math.sin(i*.0035+t*.00022*(k+1)+.9)*amp*.9+Math.sin(i*.0011-t*.00013*(k+2))*amp*.8;x.lineTo(i,y+th)}
      x.closePath();x.fill()});
    x.globalCompositeOperation='source-over'}
  function net(P,move){
    const R=150,R2=R*R;
    for(const n of nodes){if(move){n.x+=n.vx;n.y+=n.vy;if(n.x<-20)n.x=W+20;if(n.x>W+20)n.x=-20;if(n.y<-20)n.y=H+20;if(n.y>H+20)n.y=-20;
      if(n.blink>0)n.blink-=.02;else if(Math.random()<.0015)n.blink=1}}
    x.lineWidth=1;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
      if(d<R2){x.strokeStyle=`rgba(${P.node},${(1-d/R2)*P.line})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
    for(const n of nodes){const r=1.4+n.blink*2.6;x.fillStyle=`rgba(${P.node},${.45+n.blink*.55})`;x.beginPath();x.arc(n.x,n.y,r,0,6.283);x.fill();
      if(n.blink>.05){x.strokeStyle=`rgba(${P.node},${n.blink*.5})`;x.beginPath();x.arc(n.x,n.y,r+10*(1-n.blink)+4,0,6.283);x.stroke()}}}
  /* hell: lava glow from below, licking flame tongues, embers rising and flickering */
  function newEmber(any){return{x:Math.random()*W,y:any?Math.random()*H:H+10+Math.random()*40,vy:-(.25+Math.random()*.9),vx:(Math.random()-.5)*.3,s:.8+Math.random()*2.4,ph:Math.random()*6.28,hot:Math.random()}}
  function hell(t,move){
    const pulse=.75+.25*Math.sin(t*.0012)+.08*Math.sin(t*.0047);
    const g=x.createRadialGradient(W/2,H*1.15,H*.1,W/2,H*1.15,H*1.05);
    g.addColorStop(0,`rgba(255,120,20,${.55*pulse})`);g.addColorStop(.35,`rgba(220,40,10,${.32*pulse})`);g.addColorStop(.7,'rgba(90,0,10,.18)');g.addColorStop(1,'rgba(20,0,0,0)');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    [[255,90,10,.22,.62],[255,40,20,.16,.72],[255,170,40,.14,.82]].forEach(([r,gg,b,a,lvl],k)=>{
      const top=H*lvl,grad=x.createLinearGradient(0,top-160,0,H);
      grad.addColorStop(0,`rgba(${r},${gg},${b},0)`);grad.addColorStop(.6,`rgba(${r},${gg},${b},${a})`);grad.addColorStop(1,`rgba(${r},${gg},${b},${a*1.6})`);
      x.fillStyle=grad;x.beginPath();x.moveTo(0,H);
      for(let i=0;i<=W+30;i+=30){const f=Math.sin(i*.012+t*.0021*(k+1))*38+Math.sin(i*.031-t*.0037)*22+Math.abs(Math.sin(i*.004+t*.0009+k))*-90;x.lineTo(i,top+f)}
      x.lineTo(W,H);x.closePath();x.fill()});
    for(const e of embers){
      if(move){e.y+=e.vy;e.x+=e.vx+Math.sin(t*.002+e.ph)*.35;if(e.y<-10||e.x<-10||e.x>W+10)Object.assign(e,newEmber(false))}
      const life=Math.max(0,Math.min(1,e.y/H)),fl=.55+.45*Math.sin(t*.012+e.ph*7);
      const col=e.hot>.7?'255,220,120':e.hot>.35?'255,140,40':'255,70,30';
      x.fillStyle=`rgba(${col},${(.25+.75*life)*fl})`;x.shadowColor=`rgb(${col})`;x.shadowBlur=8;
      x.beginPath();x.arc(e.x,e.y,e.s*(.4+.6*life),0,6.283);x.fill()}
    x.shadowBlur=0;x.globalCompositeOperation='source-over'}
  function sparks(dt){
    if(!parts.length&&!had)return;y.clearRect(0,0,W,H);had=parts.length>0;
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
      p.vy+=.00045*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;const a=Math.min(1,p.life/400);
      y.save();y.translate(p.x,p.y);y.rotate(p.r);y.globalAlpha=a;y.fillStyle=p.c;y.shadowColor=p.c;y.shadowBlur=12;
      if(p.k){y.beginPath();y.moveTo(0,-p.s);y.lineTo(p.s*.7,0);y.lineTo(0,p.s);y.lineTo(-p.s*.7,0);y.closePath();y.fill()}else y.fillRect(-p.s/2,-p.s/6,p.s,p.s/3);
      y.restore()}}
  let last=0,acc=0;
  function frame(t){
    requestAnimationFrame(frame);
    if(document.hidden)return;
    const dt=Math.min(60,t-(last||t));last=t;
    const still=rm.matches;
    if(still&&!paintStatic&&!parts.length)return;
    acc+=dt;if(!parts.length&&acc<33)return;acc=0;      /* ~30 fps unless sparks fly */
    const P=PAL[root.dataset.skin]||PAL.night;
    sparks(dt);if(still&&!paintStatic)return;x.clearRect(0,0,W,H);if(root.dataset.skin==='hell')hell(still?0:t,!still);else{aurora(still?0:t,P);net(P,!still)}paintStatic=false}
  requestAnimationFrame(frame);

  window.HBFX={burst(px,py,ok){
    const css=getComputedStyle(root),cols=ok?[css.getPropertyValue('--easy'),css.getPropertyValue('--accent'),root.dataset.skin==='hell'?'#FFF1C9':'#E8FBFF',css.getPropertyValue('--hard')]:[css.getPropertyValue('--rec')];
    const n=ok?46:14;
    for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(ok?.25:.12)+Math.random()*(ok?.35:.12);
      parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(ok?.18:0),r:Math.random()*3,vr:(Math.random()-.5)*.02,s:ok?4+Math.random()*6:3+Math.random()*3,c:cols[i%cols.length].trim(),k:ok&&i%3===0,life:700+Math.random()*700})}}};

  /* hook the game: celebrate a right answer where it was given */
  if(typeof answer==='function'){const orig=answer;
    answer=function(i){const was=G.answered;orig(i);if(was||!G.fb)return;
      const el=document.querySelector('#tab-game .opt.'+(G.fb.ok?'right':'wrong'));
      if(el&&!rm.matches){const r=el.getBoundingClientRect();HBFX.burst(r.left+r.width/2,r.top+r.height/2,G.fb.ok)}}}
})();

<script>
/* ===== sound: synthesized effects (Web Audio) + announcer voice lines ===== */
(function(){
  const root=document.documentElement;
  let on=true;try{on=localStorage.getItem('hb2_snd')!=='off'}catch(e){}
  let ctx=null,master=null,verb=null,verbIn=null;
  const hellish=()=>root.dataset.skin==='hell';
  function init(){
    if(ctx)return ctx;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    ctx=new AC();master=ctx.createGain();master.gain.value=.55;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp);comp.connect(ctx.destination);
    /* generated hall reverb */
    verb=ctx.createConvolver();const len=ctx.sampleRate*2.4,ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
    verb.buffer=ir;verbIn=ctx.createGain();verbIn.gain.value=.32;verbIn.connect(verb);verb.connect(master);
    return ctx}
  const unlock=()=>{if(!on)return;init();if(ctx&&ctx.state==='suspended')ctx.resume()};
  addEventListener('pointerdown',unlock,{passive:true});addEventListener('keydown',unlock);
  const ready=()=>on&&init()&&ctx.state==='running';
  const out=(g,wet=1)=>{g.connect(master);if(wet){const s=ctx.createGain();s.gain.value=wet;g.connect(s);s.connect(verbIn)}};
  const hz=n=>440*Math.pow(2,(n-69)/12);
  /* one voice: glass bell (cold themes) or growling saw (hell) */
  function note(midi,t0,dur,vol=.22,wet=1){
    const t=ctx.currentTime+t0,g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    if(hellish()){
      const o1=ctx.createOscillator(),o2=ctx.createOscillator(),lp=ctx.createBiquadFilter(),sh=ctx.createWaveShaper();
      o1.type='sawtooth';o2.type='square';o1.frequency.value=hz(midi-12);o2.frequency.value=hz(midi-24)*1.005;
      const k=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;k[i]=Math.tanh(x*3)}sh.curve=k;
      lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(380,t+dur);lp.Q.value=6;
      const m=ctx.createGain();m.gain.value=.5;o1.connect(sh);o2.connect(m);m.connect(sh);sh.connect(lp);lp.connect(g);
      o1.start(t);o2.start(t);o1.stop(t+dur+.05);o2.stop(t+dur+.05);
    }else{
      [[1,1],[2.76,.32],[5.4,.12]].forEach(([r,a])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=r===1?'triangle':'sine';o.frequency.value=hz(midi)*r;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.05)});
    }
    out(g,wet)}
  function noise(t0,dur,f0,f1,vol=.2,q=1.2,type='bandpass'){
    const t=ctx.currentTime+t0,n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;
    const f=ctx.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    n.connect(f);f.connect(g);out(g,.6);n.start(t);n.stop(t+dur)}
  function glide(t0,dur,f0,f1,vol=.2,type='sine'){
    const t=ctx.currentTime+t0,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);out(g,.5);o.start(t);o.stop(t+dur+.02)}

  const SFX={
    right(cl){const seq=cl==='h'?[72,76,79,84,88]:cl==='m'?[72,76,79,84]:[76,83];const st=cl==='h'?.055:.07;seq.forEach((n,i)=>note(n,i*st,cl==='h'?1.1:.7,cl==='h'?.2:.17))},
    wrong(){if(hellish()){glide(0,.5,140,45,.32,'sawtooth');noise(0,.35,900,120,.25,.8,'lowpass')}else{glide(0,.38,220,92,.22,'square');glide(.02,.38,233,96,.16,'square')}},
    gem(){const p=[72,74,76,79,81,84,86,88,91,93,96];p.forEach((n,i)=>note(n,i*.045,.9,.12,1.2));noise(.05,.9,6000,12000,.08,.7,'highpass')},
    tick(hot){if(hellish())note(hot?57:50,0,.09,hot?.22:.12,.2);else{const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=hot?2300:1700;
      g.gain.setValueAtTime(hot?.2:.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);out(g,.15);o.start(t);o.stop(t+.06)}},
    timeout(){glide(0,.45,hellish()?300:680,hellish()?60:140,.2,hellish()?'sawtooth':'sine');noise(0,.4,2000,300,.12)},
    whoosh(){noise(0,.7,250,4200,.22,1.4);glide(.05,.6,hellish()?90:220,hellish()?260:660,.08,'triangle')},
    swoosh(){noise(0,.35,3000,600,.12,1.6)},
    fanfare(){const ch=[[60,64,67],[65,69,72],[67,71,74],[72,76,79,84]],d=[0,.22,.44,.7];ch.forEach((c,i)=>c.forEach(n=>note(n,d[i],i===3?1.8:.5,.12,1.1)))},
    round(){[60,67,72].forEach((n,i)=>note(n,i*.09,.6,.14))},
    blip(ok){if(ok)note(hellish()?79:88,0,.35,.07,.6);else note(hellish()?50:57,0,.3,.06,.3)},
    click(){const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=hellish()?420:1250;
      g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);out(g,0);o.start(t);o.stop(t+.05)}
  };

  /* ---- announcer voice: processed files in voice/, browser speech as fallback ---- */
  const VOICE={round1:'Раунд перший! Бій!',round2:'Раунд другий! Бій!',round3:'Раунд третій! Бій!',round4:'Раунд четвертий! Бій!',round5:'Раунд п’ятий! Бій!',
    finish:'Добий!',diamond:'Діамант!',ruby:'Рубін!',crush:'Нищівно!',perfect:'Ідеально!',lastmin:'Остання хвилина!',superfinal:'Суперфінал!',victory:'Перемога!',gameover:'Гру завершено!',leader:'Новий лідер!',start:'Гра починається! Бій!'};
  const COOL={leader:20,diamond:3,ruby:3,crush:4},said={};
  const buf={},miss={};let speaking=0;
  async function load(k){if(buf[k]||miss[k])return buf[k];try{const r=await fetch('voice/'+k+'.mp3');if(!r.ok)throw 0;buf[k]=await ctx.decodeAudioData(await r.arrayBuffer())}catch(e){miss[k]=1}return buf[k]}
  async function say(k,delay=0){
    if(!ready()||!VOICE[k])return;const now=ctx.currentTime;if(now<speaking)return;if(COOL[k]&&said[k]&&now-said[k]<COOL[k])return;said[k]=now;   /* never talk over itself */
    window.__sndLog&&__sndLog.push('say:'+k);const b=await load(k);
    if(b){const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=1.15;s.buffer=b;s.connect(g);g.connect(master);const t=ctx.currentTime+delay;s.start(t);speaking=t+b.duration;return}
    if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(VOICE[k]);u.lang='uk-UA';u.pitch=.6;u.rate=.92;u.volume=.9;
      const v=speechSynthesis.getVoices().find(v=>/^uk/i.test(v.lang));if(v)u.voice=v;speaking=ctx.currentTime+1.6;setTimeout(()=>speechSynthesis.speak(u),delay*1000)}}
  const play=(k,...a)=>{if(ready())try{SFX[k](...a);window.__sndLog&&__sndLog.push(k)}catch(e){}};
  window.HBSND={play,say,get on(){return on}};

  /* ---- toggle in the OSD strip ---- */
  const osd=document.querySelector('.osd');
  if(osd){const b=document.createElement('button');b.className='skinbtn';b.type='button';
    const lab=()=>{b.textContent=on?'Звук: увімк.':'Звук: вимк.';b.setAttribute('aria-pressed',on)};lab();
    b.onclick=()=>{on=!on;try{localStorage.setItem('hb2_snd',on?'on':'off')}catch(e){}lab();if(on){unlock();setTimeout(()=>play('round'),60)}};
    osd.appendChild(b)}

  /* ---- game hooks ---- */
  const evs=()=>(myAns.games?.[G.gid]?.ev)||[];
  const isSF=()=>!!S.games[G.gid]?.superfinal;
  if(typeof answer==='function'){const orig=answer;
    answer=function(i){const was=G.answered,cl=G.q?.cl;const g0=scoreEvents(evs(),sc()).gems;orig(i);if(was||!G.fb)return;
      const ok=G.fb.ok;const g1=scoreEvents(evs(),sc()).gems;
      if(ok)play('right',cl);else play('wrong');
      if(isSF())return;
      if(g1.d>g0.d){setTimeout(()=>play('gem'),220);say('diamond',.35)}
      else if(g1.r>g0.r){setTimeout(()=>play('gem'),220);say('ruby',.35)}
      else if(ok){const st=streakState(evs());if((cl==='h'&&st.h===GEM_N-1)||(cl==='m'&&st.m===GEM_N-1))say('finish',.35);else if(cl==='h')say('crush',.3)}}}
  if(typeof startRound==='function'){const orig=startRound;
    startRound=function(){const before=G.state;orig();if(G.state!=='play'||before==='play')return;play('whoosh');
      if(isSF()){say('superfinal',.3);return}
      const per=sc().qPerRound||10,n=Math.min(5,Math.floor(evs().length/per)+1);say('round'+n,.35)}}
  if(typeof endRound==='function'){const orig=endRound;
    endRound=function(){const was=G.state,re=(G.roundEv||[]).slice();orig();if(was!=='play')return;play('fanfare');
      if(re.length>=5&&re.every(e=>e.ok))say('perfect',.6)}}
  if(typeof toast==='function'){const orig=toast;toast=function(m){if(typeof m==='string'&&m.startsWith('Час вийшов'))play('timeout');return orig.apply(this,arguments)}}

  /* soft click on every button and tab (answers have their own sounds) */
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button,a.btn');if(!b||b.disabled||b.closest('.opt')||b.matches('[data-a]'))return;play('click')},true);

  /* commentator: what happens in the live game is heard on every screen */
  let lastSec=null,k=0,seen=null,gemsSeen={},leaderSeen={},liveWas={},lastMinDone={},lastBlip=0;
  setInterval(()=>{
    if(!on||!ctx)return;
    if(G.state==='play'&&G.q&&!G.answered){const QT=qTimeOf(sc(),G.q.cl),rem=Math.ceil(QT-(Date.now()-G.qStart)/1000);
      if(rem!==lastSec&&rem<=10&&rem>0)play('tick',rem<=3);lastSec=rem}else lastSec=null;
    if(++k%4)return;
    let games=[];try{games=seasonGames()}catch(e){return}
    games.forEach(g=>{const l=isLive(g);
      if(liveWas[g.id]===undefined){liveWas[g.id]=l;if(l&&g.endsAt-vnow()<=60000)lastMinDone[g.id]=1;return}
      if(!liveWas[g.id]&&l){play('whoosh');say(g.superfinal?'superfinal':'start',.3)}
      if(liveWas[g.id]&&!l){play('fanfare');say(myAns.games?.[g.id]?.team&&!isOrg()?'gameover':'victory',.9)}
      liveWas[g.id]=l;
      if(l){const left=g.endsAt-vnow();if(left<=60000&&!lastMinDone[g.id]){lastMinDone[g.id]=1;if(left>45000)say('lastmin')}}});
    const lg=games.find(isLive);if(!lg)return;
    const mine=myAns.games?.[lg.id]?.team,fresh=[],cnt={};
    Object.entries(S.answers).forEach(([uid,d])=>{const ev=d?.games?.[lg.id]?.ev;if(!ev)return;cnt[uid]=ev.length;
      if(seen&&seen.gid===lg.id&&uid!==S.uid)for(let i=seen.c[uid]||0;i<ev.length;i++)fresh.push(ev[i])});
    seen={gid:lg.id,c:cnt};
    let R;try{R=compute([lg.id])}catch(e){return}
    let gem=null;
    R.ts.forEach(t=>{const key=lg.id+'|'+t.id,g=t.s.gems||{},now={d:g.d||0,r:g.r||0},p=gemsSeen[key];
      if(p&&!lg.superfinal&&t.id!==mine){if(now.d>p.d)gem='diamond';else if(now.r>p.r&&!gem)gem='ruby'}gemsSeen[key]=now});
    const leader=R.ts.find(t=>t.s.n)?.id,prev=leaderSeen[lg.id];if(leader)leaderSeen[lg.id]=leader;
    if(gem){play('gem');say(gem,.3)}
    else if(leader&&prev&&leader!==prev){play('swoosh');say('leader',.25)}
    else if(fresh.length&&G.state!=='play'&&Date.now()-lastBlip>350){lastBlip=Date.now();play('blip',fresh[fresh.length-1].ok)}
  },250);
})();
</script>
